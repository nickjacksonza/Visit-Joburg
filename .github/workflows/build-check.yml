name: Build check

# Runs on every pull request, so a broken build, or a failing check
# shows up before anything is merged. It only builds and checks; it never commits or deploys.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build.py reads git history for lastmod dates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tools/test_editor.js   # the editor rules and the shipped JSON must agree
      - run: python3 build.py
      - run: python3 tools/check.py
      - run: python3 tools/check_schema_vocab.py   # every type and property must exist in schema.org
