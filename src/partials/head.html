<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--CSP-->
{{ site_verification }}
<title>{{ title_full }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="{{ robots }}">
<script>document.documentElement.classList.add("js")</script>
<link rel="canonical" href="{{ canonical }}">
<link rel="alternate" type="text/markdown" href="{{ md_href }}">
<link rel="icon" href="{{ root }}images/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f5f5b">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ name }}">
<meta property="og:title" content="{{ title_full }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ name }}">
<meta property="og:locale" content="{{ og_locale }}">
<meta name="twitter:card" content="summary_large_image">
{{ font_preload }}
{{ hero_preload }}
<link rel="stylesheet" href="{{ root }}css/site.css?v={{ css_v }}">
<script type="application/ld+json">{{ jsonld }}</script>
{{ analytics }}
</head>
